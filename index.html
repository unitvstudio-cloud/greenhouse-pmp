<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greenhouse PMP V3.1</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#142f29;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:#166a55;color:white}button.secondary{background:#e5efeb;color:#184c3e}button.danger{background:#f9e0df;color:#972e34}input,select,textarea{border:1px solid #c8d8d0;border-radius:8px;padding:9px;width:100%;background:white}textarea{min-height:75px;resize:vertical}header{background:#124b3e;color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header small{opacity:.7}nav{background:white;border-bottom:1px solid #dce7e0;display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px}nav button{background:transparent;color:#33564d}nav button.active{background:#def0e5;color:#14523e}.container{max-width:1200px;margin:20px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e8e4;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 10px #102f2010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:650;color:#48645c}.muted{color:#72877f;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.metric{padding:18px;background:#ecf5ee;border-radius:10px}.metric strong{display:block;font-size:23px;margin:6px 0}.tag{display:inline-block;background:#e7f1ee;color:#22604a;padding:4px 9px;border-radius:30px;font-size:12px}.dangerText{color:#b62b39}.warn{color:#a15a0b}.ok{color:#16804b}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e9eee9;text-align:left}th{background:#f4f8f5}td input,td select{min-width:100px}.scroll{overflow:auto}.hide{display:none!important}.tabnote{background:#f0f8f4;padding:12px;border-radius:10px;margin:12px 0}.progress{height:12px;background:#e4ece7;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#1c9977}.item{padding:10px;border:1px solid #e2eae5;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#eee;padding:3px 8px;border-radius:20px}.gantt{display:grid;grid-template-columns:175px repeat(12,minmax(24px,1fr));min-width:550px}.gantt>*{padding:7px 2px;border-bottom:1px solid #eef1ef;font-size:11px;text-align:center}.gantt .bar{background:#72b69b;border-radius:5px;margin:3px 1px}.gantt .head{background:#edf3ef;font-weight:bold}.gantt .label{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer{padding:16px;color:#81938a;text-align:center;font-size:12px}@media(max-width:700px){header{padding:12px}nav{overflow:auto}table{font-size:12px}.panel{padding:13px}}
</style></head><body><header><div><b>🌱 Greenhouse PMP</b> <span class="tag">V3.1 · 오프라인</span><div><small>작기 착수 → PMP 계획 → 승인 → 실행 → 분석</small></div></div><div class="actions"><select id="projectSelect" aria-label="프로젝트 선택" style="min-width:190px"></select><button onclick="newProject()">+ 프로젝트</button></div></header><nav id="nav"></nav><main class="container" id="content"></main><footer>로컬 브라우저 저장 · API/ERP/생육/환경/양액 연동 없음 · 중요한 자료는 JSON 백업 권장</footer><script>
'use strict';const KEY='greenhouse-pmp-v3-data';const areas=['표준·헌장','PMBOK 가이드','거버넌스','범위','일정','재무','이해관계자','자원','리스크','AI PM','데이터'];let view='대시보드';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const won=n=>Math.round(num(n)).toLocaleString('ko-KR')+'원';const uid=()=>Math.random().toString(36).slice(2,10);const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const iso=()=>localDate(new Date());const days=(a,b)=>a&&b?Math.round((new Date(b)-new Date(a))/86400000):0;const cropPresets={토마토:{tasks:[['육묘·자재 준비',-30,-7],['온실 정비',-14,-1],['정식',0,0],['활착 및 초기 생육',1,28],['수확',60,160]],risks:[['병해충 발생',4,4,'예찰·방제계획 수립'],['여름철 고온',4,4,'차광·환기·냉방 계획']],scope:'토마토 재배 및 출하'},달래:{tasks:[['종구 및 자재 확보',-21,-7],['토양·배지 준비',-14,-2],['파종·식재',0,0],['생육 관리',1,70],['수확·선별',70,100]],risks:[['과습 및 뿌리 손상',3,4,'배수·관수 관리'],['종구 수급 불안',3,3,'대체 공급업체 확보']],scope:'달래 재배 및 출하'}};function offset(s,d){let x=new Date((s||iso())+'T00:00:00');x.setDate(x.getDate()+d);return localDate(x)}
function blank(crop='토마토'){const id=uid(),start=iso(),pre=cropPresets[crop]||{tasks:[['사업 준비',-14,-1],['시작',0,0],['운영',1,90],['종료',90,90]],risks:[['일정 지연',3,3,'주간 점검']],scope:'프로젝트 범위 기술'};return{id,name:crop+' 작기 '+start,crop,facility:'',area:0,start,end:offset(start,180),harvest:offset(start,crop==='달래'?75:65),pm:'',sponsor:'',objective:'',scope:pre.scope,exclusions:'',criteria:'',governance:'주요 변경은 PM 검토 후 승인권자 승인',decision:'',budget:0,price:0,volume:0,variableCost:0,actualCost:0,status:'초안',approval:{by:'',date:'',memo:''},stakeholders:[{id:uid(),name:'',role:'PM',influence:5,interest:5,plan:'주간 점검'}],resources:[],tasks:pre.tasks.map(t=>({id:uid(),name:t[0],start:offset(start,t[1]),end:offset(start,t[2]),owner:'',done:0})),risks:pre.risks.map(r=>({id:uid(),name:r[0],p:r[1],impact:r[2],response:r[3],owner:'',status:'열림'})),checks:{},log:[]}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.projects)){let p=blank();state={projects:[p],selected:p.id}}if(!state.projects.length){let p=blank();state.projects=[p];state.selected=p.id}let p=()=>state.projects.find(x=>x.id===state.selected)||state.projects[0];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('저장 실패: 브라우저 저장 공간 또는 보안 설정을 확인하세요. JSON 백업을 사용해 주세요.')}}function set(k,v){p()[k]=v;save()}function update(k,v){set(k,v);render()}function field(label,k,type='text',hint=''){return `<div class="field"><label for="f_${k}">${esc(label)}</label><input id="f_${k}" type="${type}" value="${esc(p()[k])}" placeholder="${esc(hint)}" onchange="set('${k}',this.type==='number'?num(this.value):this.value);render()"></div>`}function ta(label,k){return `<div class="field"><label>${esc(label)}</label><textarea onchange="set('${k}',this.value)">${esc(p()[k])}</textarea></div>`}function top(h,sub=''){return `<section class="panel"><h2>${h}</h2>${sub?`<p class="muted">${sub}</p>`:''}`};function close(){return '</section>'}function render(){let s=$('projectSelect');s.innerHTML=state.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===p().id?'selected':''}>${esc(x.name)}</option>`).join('');s.onchange=e=>{state.selected=e.target.value;save();render()};$('nav').innerHTML=['대시보드',...areas].map(a=>`<button class="${view===a?'active':''}" onclick="changeView('${a}')">${a}</button>`).join('');$('content').innerHTML=pages[view]();}function changeView(v){view=v;render()}function newProject(){let crop=prompt('작물명 (기본: 토마토 / 달래, 그 외 직접 입력 가능)','토마토');if(crop===null)return;crop=crop.trim()||'토마토';let q=blank(crop);state.projects.push(q);state.selected=q.id;save();view='표준·헌장';render()}function removeProject(){if(!confirm('현재 프로젝트를 삭제하시겠습니까? 이 작업은 취소할 수 없습니다.'))return;state.projects=state.projects.filter(q=>q.id!==p().id);if(!state.projects.length)state.projects=[blank()];state.selected=state.projects[0].id;save();render()}function duplicate(){let q=JSON.parse(JSON.stringify(p()));q.id=uid();q.name+=' (복사)';q.status='초안';q.approval={by:'',date:'',memo:''};q.log=[];state.projects.push(q);state.selected=q.id;save();render()}
function readiness(q){const r=[['목표와 범위',!!q.objective&&!!q.scope],['일정',q.tasks.length>0&&q.tasks.every(t=>t.start&&t.end&&t.end>=t.start)],['재무',q.budget>0],['책임자 및 승인권자',!!q.pm&&!!q.sponsor],['이해관계자',q.stakeholders.some(x=>x.name)],['자원',q.resources.length>0],['리스크 대응',q.risks.length>0&&q.risks.every(x=>x.response)],['검토 체크리스트',Object.values(q.checks).filter(Boolean).length>=8]];return r}const checks=['프로젝트 헌장 검토','거버넌스 및 승인권자 확인','범위와 제외 범위 확정','주요 일정 검토','예산 승인 검토','이해관계자 및 소통계획 검토','자원 확보 가능성 검토','리스크 대응계획 검토'];function dashboard(){let q=p(),r=readiness(q),ok=r.filter(x=>x[1]).length,risks=q.risks.filter(x=>x.status!=='종결'&&num(x.p)*num(x.impact)>=12).length,profit=num(q.price)*num(q.volume)-num(q.variableCost)*num(q.volume)-num(q.budget);return top('작기 프로젝트 대시보드',esc(q.name)) + `<div class="grid"><div class="metric">착수 준비도<strong>${ok}/${r.length}</strong><div class="progress"><div style="width:${ok/r.length*100}%"></div></div></div><div class="metric">진행 상태<strong>${esc(q.status)}</strong><span class="muted">승인: ${esc(q.approval.by||'미승인')}</span></div><div class="metric">고위험 항목<strong class="${risks?'dangerText':''}">${risks}건</strong></div><div class="metric">예상손익(단순)<strong class="${profit<0?'dangerText':''}">${won(profit)}</strong></div></div><h3>착수 준비 점검</h3>${r.map(x=>`<div class="item"><span>${x[1]?'✅':'⬜'} ${esc(x[0])}</span><span class="tag">${x[1]?'확인':'보완'}</span></div>`).join('')}<div class="actions"><button onclick="changeView('AI PM')">AI PM 분석</button><button class="secondary" onclick="duplicate()">작기 복사</button><button class="danger" onclick="removeProject()">삭제</button></div>`+close()+top('작기 일정 요약')+gantt(q.tasks)+close()}
function standard(){let q=p();return top('프로젝트관리 표준 · 프로젝트 헌장','작성·저장되는 프로젝트 착수 기본정보')+`<div class="grid">${field('프로젝트명','name')}${field('작물','crop')}${field('시설명','facility')}${field('면적(㎡)','area','number')}${field('시작 예정일','start','date')}${field('종료 예정일','end','date')}${field('첫 수확 예정일','harvest','date')}${field('프로젝트 관리자(PM)','pm')}${field('스폰서/승인권자','sponsor')}</div>${ta('프로젝트 목적·성과목표','objective')}<p class="muted">상태는 아래 거버넌스 탭의 착수 승인 절차로 변경합니다.</p><p>현재 상태: <b>${esc(q.status)}</b></p>`+close()}
function guide(){let blocks=[['프로젝트관리 표준','프로젝트의 가치를 명확히 하고, 의사결정·측정·개선 체계를 구축합니다. 원칙과 성과에 맞게 도구를 조정(Tailoring)합니다.'],['프로젝트관리 지식체계 지침서','PMBOK의 관점으로 목적, 책임, 범위, 일정, 재무, 이해관계자, 자원, 위험을 연결합니다. 아래는 자체 요약이며 PMI 공식 원문을 재현하지 않습니다.'],['거버넌스','누가 어떤 결정을 승인하는지, 변경과 예외를 어떻게 처리하는지 정의합니다.'],['범위','무엇을 할지/하지 않을지, 결과물을 어떻게 인수할지 기록합니다.'],['일정','작업별 시작·종료일, 담당자, 진행률을 관리합니다.'],['재무','예산·수익 가정을 기록하고 실제 비용과 차이를 검토합니다.'],['이해관계자','PM과 팀원도 이해관계자입니다. 영향력, 관심도, 소통방안을 관리합니다.'],['자원','인력·설비·자재 가용성과 책임을 확인합니다.'],['리스크','발생가능성×영향도를 평가해 대응하고 상태를 업데이트합니다.']];return top('PMP/PMBOK 실무 가이드','작기 프로젝트에 적용하기 위한 자체 교육용 요약 · 원문과 인증 교재를 대체하지 않음')+blocks.map((b,i)=>`<div class="item" style="display:block"><b>${i+1}. ${b[0]}</b><p>${b[1]}</p></div>`).join('')+close()}
function governance(){let q=p(),ready=readiness(q),can=ready.every(x=>x[1]);return top('거버넌스 · 착수 의사결정')+ta('의사결정/변경관리 규칙','governance')+ta('주요 의사결정 사항','decision')+`<h3>착수 전 8항목 체크리스트</h3>${checks.map((x,i)=>`<label class="item"><span><input type="checkbox" style="width:auto" ${q.checks[i]?'checked':''} onchange="p().checks[${i}]=this.checked;save();render()"> ${esc(x)}</span></label>`).join('')}<div class="tabnote">필수 정보 완성: ${ready.filter(x=>x[1]).length}/${ready.length}. ${can?'승인 검토 준비가 완료되었습니다.':'누락 항목을 보완해야 합니다.'}</div><div class="grid"><div class="field"><label>승인자 이름</label><input id="approver" value="${esc(q.approval.by)}" placeholder="실제 승인권자"></div><div class="field"><label>승인 의견</label><input id="approvalMemo" value="${esc(q.approval.memo)}"></div></div><div class="actions" style="margin-top:12px"><button ${can?'':'disabled style="opacity:.5"'} onclick="approve()">착수 승인 기록</button><button class="secondary" onclick="requestReview()">검토 요청 상태로 변경</button><button class="danger" onclick="revoke()">승인 취소</button></div><p class="muted">전자서명·권한 인증이 없는 로컬 기록입니다. 승인권자 확인 후 해당 승인자가 직접 입력해야 합니다.</p><h3>의사결정 기록</h3>${q.log.slice().reverse().map(x=>`<div class="item">${esc(x.date)} · ${esc(x.action)} · ${esc(x.by)} ${esc(x.memo)}</div>`).join('')||'<p class="muted">기록 없음</p>'}`+close()}
function approve(){let who=$('approver').value.trim(),memo=$('approvalMemo').value.trim();if(!who)return alert('승인자 이름을 입력하세요.');if(!readiness(p()).every(x=>x[1]))return alert('착수 점검을 완료하세요.');p().approval={by:who,date:iso(),memo};p().status='착수 승인';p().log.push({date:iso(),action:'착수 승인',by:who,memo});save();render()}function requestReview(){p().status='검토 요청';p().log.push({date:iso(),action:'검토 요청',by:p().pm||'미기재',memo:''});save();render()}function revoke(){if(!confirm('승인 상태를 취소하시겠습니까?'))return;p().status='초안';p().approval={by:'',date:'',memo:''};p().log.push({date:iso(),action:'승인 취소',by:p().pm||'미기재',memo:''});save();render()}
function scopePage(){return top('범위 성과 영역')+ta('작업 범위 및 산출물','scope')+ta('프로젝트 제외 범위','exclusions')+ta('완료/인수 기준','criteria')+`<div class="tabnote">예시: 토마토 2,200평 온실 1작기 생산. 목표 출하량·품질·종료 기준을 프로젝트별로 명시하세요.</div>`+close()}
function rows(key,cols){let q=p();return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>삭제</th></tr></thead><tbody>${q[key].map((row,i)=>`<tr>${cols.map(([label,k,type,opts])=>`<td>${type==='select'?`<select onchange="cell('${key}',${i},'${k}',this.value)">${opts.map(opt=>`<option ${String(row[k])===String(opt)?'selected':''}>${esc(opt)}</option>`).join('')}</select>`:`<input type="${type||'text'}" value="${esc(row[k])}" aria-label="${esc(label)}" onchange="cell('${key}',${i},'${k}',this.type==='number'?num(this.value):this.value)">`}</td>`).join('')}<td><button class="danger" onclick="delRow('${key}',${i})">×</button></td></tr>`).join('')}</tbody></table></div>`}function cell(key,i,k,v){p()[key][i][k]=v;save();render()}function delRow(key,i){p()[key].splice(i,1);save();render()}function addRow(key,template){p()[key].push({id:uid(),...template});save();render()}
const taskCols=[['작업','name'],['시작일','start','date'],['종료일','end','date'],['담당자','owner'],['진행률(%)','done','number']];function gantt(tasks){if(!tasks.length)return'<p class="muted">일정이 없습니다.</p>';let valid=tasks.filter(t=>t.start&&t.end);if(!valid.length)return'<p>날짜를 입력하세요.</p>';let min=valid.map(t=>t.start).sort()[0],max=valid.map(t=>t.end).sort().at(-1);let all=Math.max(days(min,max)+1,1),slice=Math.max(1,Math.ceil(all/12));let labels=Array.from({length:12},(_,i)=>offset(min,i*slice));return `<div class="scroll"><div class="gantt"><div class="head">작업명</div>${labels.map(d=>`<div class="head">${d.slice(5)}</div>`).join('')}${tasks.map(t=>`<div class="label">${esc(t.name)} (${num(t.done)}%)</div>${labels.map((date,i)=>{let a=offset(min,i*slice),b=offset(min,(i+1)*slice-1);return `<div class="${t.start<=b&&t.end>=a?'bar':''}" title="${esc(t.name)}: ${esc(t.start)} ~ ${esc(t.end)}"></div>`}).join('')}`).join('')}</div></div>`}
function schedule(){return top('일정 성과 영역 · 간트차트')+rows('tasks',taskCols)+`<div class="actions"><button onclick="addRow('tasks',{name:'신규 작업',start:p().start,end:p().start,owner:'',done:0})">+ 작업 추가</button><button class="secondary" onclick="shiftTasks()">작기 시작일 기준 템플릿 재적용</button></div><h3>간트차트</h3>${gantt(p().tasks)}<p class="muted">일정 변경은 입력 필드를 수정하면 자동 저장됩니다.</p>`+close()}function shiftTasks(){if(!confirm('기존 일정을 작물 템플릿으로 덮어쓰시겠습니까?'))return;let q=p(),pres=cropPresets[q.crop]||cropPresets.토마토;q.tasks=pres.tasks.map(t=>({id:uid(),name:t[0],start:offset(q.start,t[1]),end:offset(q.start,t[2]),owner:'',done:0}));save();render()}
function finance(){let q=p(),sales=num(q.price)*num(q.volume),variable=num(q.variableCost)*num(q.volume),profit=sales-variable-num(q.budget),margin=sales?profit/sales*100:0,breakEven=(num(q.price)-num(q.variableCost))>0?num(q.budget)/(num(q.price)-num(q.variableCost)):null;return top('재무 성과 영역 · 예산과 손익','수량 단위는 kg이며 판매단가/변동원가는 원/kg, 고정·작기 예산은 원/작기입니다. 단순 시뮬레이션입니다.')+`<div class="grid">${field('작기 예산(고정비 가정, 원)','budget','number')}${field('예상 판매량(kg)','volume','number')}${field('예상 판매단가(원/kg)','price','number')}${field('변동원가(원/kg)','variableCost','number')}${field('현재 실제 지출(원)','actualCost','number')}</div><div class="grid" style="margin-top:12px"><div class="metric">예상 매출<strong>${won(sales)}</strong></div><div class="metric">예상 총원가<strong>${won(variable+num(q.budget))}</strong></div><div class="metric">예상 손익<strong class="${profit<0?'dangerText':'ok'}">${won(profit)}</strong></div><div class="metric">예산 집행률<strong>${num(q.budget)>0?(num(q.actualCost)/num(q.budget)*100).toFixed(1)+'%':'미산정'}</strong></div></div><p>예상 순이익률: <b>${margin.toFixed(1)}%</b> · 손익분기 판매량: <b>${breakEven===null?'산정불가':Math.ceil(breakEven).toLocaleString()+'kg'}</b></p><p class="muted">예산을 고정비로 단순 처리합니다. 실제 원가/회계에는 비용 중복 여부, 작물별 수율, 출하 등급, 세금, 감가상각 등 추가 고려가 필요합니다.</p>`+close()}
const stakeholderCols=[['이름/조직','name'],['역할','role'],['영향력 1~5','influence','number'],['관심도 1~5','interest','number'],['참여 전략','plan']];function stakeholder(){return top('이해관계자 성과 영역','프로젝트 팀원과 PM도 이해관계자입니다.')+rows('stakeholders',stakeholderCols)+`<button onclick="addRow('stakeholders',{name:'',role:'',influence:3,interest:3,plan:''})">+ 이해관계자</button>`+close()}
const resourceCols=[['자원명','name'],['구분','type','select',['인력','시설','설비','자재','외주','기타']],['수량','quantity','number'],['담당/공급처','owner'],['확보 상태','status','select',['미확보','확보 진행','확보 완료']]];function resource(){return top('자원 성과 영역')+rows('resources',resourceCols)+`<button onclick="addRow('resources',{name:'',type:'인력',quantity:1,owner:'',status:'미확보'})">+ 자원</button>`+close()}
const riskCols=[['위험 설명','name'],['발생가능성 1~5','p','number'],['영향도 1~5','impact','number'],['대응계획','response'],['담당자','owner'],['상태','status','select',['열림','대응 중','종결']]];function risk(){let ordered=[...p().risks].sort((a,b)=>num(b.p)*num(b.impact)-num(a.p)*num(a.impact));return top('리스크 성과 영역')+rows('risks',riskCols)+`<button onclick="addRow('risks',{name:'',p:3,impact:3,response:'',owner:'',status:'열림'})">+ 리스크</button><h3>위험 우선순위 (5×5)</h3>${ordered.map(x=>`<div class="item"><span>${esc(x.name||'미기재')} <span class="muted">${esc(x.response)}</span></span><b class="${num(x.p)*num(x.impact)>=12?'dangerText':'ok'}">${num(x.p)*num(x.impact)}점</b></div>`).join('')}`+close()}
function advice(){let q=p(),messages=[],add=(priority,title,detail)=>messages.push({priority,title,detail});if(!q.objective)add('높음','성과목표 미기재','정량 목표(예: 예상 수확량, 품질, 판매액)를 입력하세요.');if(!q.pm||!q.sponsor)add('높음','책임 구조 보완','PM 및 승인권자를 지정하세요.');if(q.budget<=0)add('높음','예산 미확정','계획 예산을 입력하고 승인받으세요.');if(q.start&&q.harvest&&days(q.start,q.harvest)<0)add('높음','첫 수확 날짜 오류','첫 수확일이 작기 시작일보다 앞서 있습니다.');q.tasks.filter(t=>t.end<t.start).forEach(t=>add('높음','일정 역전',t.name+' 작업의 시작/종료일을 확인하세요.'));q.tasks.filter(t=>num(t.done)<100&&t.end<iso()).forEach(t=>add('보통','예정일 경과',t.name+' 작업의 완료율과 지연 원인을 확인하세요.'));q.risks.filter(r=>r.status!=='종결'&&num(r.p)*num(r.impact)>=12).forEach(r=>add('높음','고위험 리스크: '+r.name,'대응: '+(r.response||'대응계획 미기재')+' / 담당: '+(r.owner||'미지정')));q.resources.filter(r=>r.status!=='확보 완료').forEach(r=>add('보통','자원 미확보: '+r.name,'착수 전에 확보 시점과 대체 수단을 확인하세요.'));if(q.price&&q.volume&&num(q.price)*num(q.volume)-num(q.variableCost)*num(q.volume)-num(q.budget)<0)add('높음','예상 손익 적자','가격·판매량·원가 가정을 다시 검토하세요.');if(q.stakeholders.some(s=>num(s.influence)>=4&&num(s.interest)>=4&&!s.plan))add('보통','핵심 이해관계자 소통 부족','영향력·관심도가 높은 관계자의 참여전략을 보완하세요.');if(!messages.length)add('낮음','중요 경고 없음','입력된 데이터의 규칙 점검에서 주요 경고는 확인되지 않았습니다. 실제 현장 검토는 별도입니다.');return messages}
function ai(){let q=p(),a=advice();return top('AI PM · 자동 점검 및 제안','외부 AI 모델 호출 없이 작동하는 규칙 기반 분석 엔진입니다. 예측 정확도가 검증된 ML 모델은 아닙니다.')+`<div class="grid"><div class="metric">점검 권고<strong>${a.length}건</strong></div><div class="metric">우선 검토<strong>${a.filter(x=>x.priority==='높음').length}건</strong></div></div><h3>자동 점검 결과</h3>${a.map(x=>`<div class="item"><div><span class="tag">${esc(x.priority)}</span> <b>${esc(x.title)}</b><p>${esc(x.detail)}</p></div></div>`).join('')}<div class="actions"><button onclick="copyAdvice()">분석 결과 복사</button><button class="secondary" onclick="downloadReport()">보고서 HTML 저장</button></div><p class="muted">현재 날짜, 일정, 비용, 자원, 위험 등 입력값을 바탕으로 재분석합니다. 데이터 누락이나 실측 부재가 있으면 판단도 제한됩니다.</p>`+close()}function copyAdvice(){const txt=advice().map(x=>`[${x.priority}] ${x.title}: ${x.detail}`).join('\n');navigator.clipboard?.writeText(txt).then(()=>alert('복사했습니다.')).catch(()=>prompt('아래 내용을 복사하세요',txt))}
function download(name,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download('Greenhouse_PMP_backup_'+iso()+'.json',new Blob([JSON.stringify(state,null,2)],{type:'application/json'}))}function importJSON(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.projects)||!v.projects.length||v.projects.some(x=>!x.id||!x.name||!Array.isArray(x.tasks)||!Array.isArray(x.risks)||!Array.isArray(x.resources)||!Array.isArray(x.stakeholders)))throw Error('형식 오류');if(!confirm('기존 모든 프로젝트 데이터가 백업 파일로 교체됩니다. 계속하시겠습니까?'))return;state=v;state.selected=state.projects[0].id;save();render();alert('가져오기 완료')}catch(e){alert('가져오기 실패: '+e.message)}};r.readAsText(f)}function downloadReport(){let q=p(),a=advice(),html=`<!doctype html><html lang="ko"><meta charset="utf-8"><title>${esc(q.name)}</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto;line-height:1.6}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}h1,h2{color:#14614d}</style><h1>${esc(q.name)} PMP 보고서</h1><p>생성일 ${iso()} / 작물 ${esc(q.crop)} / 시설 ${esc(q.facility)} / 상태 ${esc(q.status)}</p><h2>목표와 범위</h2><p>${esc(q.objective)}<br>${esc(q.scope)}</p><h2>일정</h2><table><tr><th>작업</th><th>시작</th><th>종료</th><th>진행률</th></tr>${q.tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.start)}</td><td>${esc(t.end)}</td><td>${num(t.done)}%</td></tr>`).join('')}</table><h2>재무</h2><p>작기 예산 ${won(q.budget)}, 예상 매출 ${won(num(q.price)*num(q.volume))}, 예상 손익 ${won(num(q.price)*num(q.volume)-num(q.variableCost)*num(q.volume)-num(q.budget))}</p><h2>리스크</h2>${q.risks.map(x=>`<p>${esc(x.name)} / 위험점수 ${num(x.p)*num(x.impact)} / 대응 ${esc(x.response)}</p>`).join('')}<h2>AI PM 규칙 점검</h2>${a.map(x=>`<p>[${esc(x.priority)}] ${esc(x.title)} — ${esc(x.detail)}</p>`).join('')}<h2>승인기록</h2><p>${esc(q.approval.by||'미승인')} ${esc(q.approval.date)}</p><p><small>교육·관리 목적의 자체 도구에서 생성한 문서</small></p></html>`;download('PMP_report_'+iso()+'.html',new Blob([html],{type:'text/html;charset=utf-8'}))}function exportCSV(){let cols=['프로젝트명','작물','시설','시작','수확','종료','담당자','상태','예산','예상판매량','단가','변동원가'];let str=[cols,...state.projects.map(q=>[q.name,q.crop,q.facility,q.start,q.harvest,q.end,q.pm,q.status,q.budget,q.volume,q.price,q.variableCost])].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('PMP_projects_'+iso()+'.csv',new Blob(['\ufeff'+str],{type:'text/csv;charset=utf-8'}))}function data(){return top('데이터 보관 · 내보내기 · 불러오기','외부 연결 없이 브라우저 저장소에 저장됩니다. 파일을 정기적으로 백업하세요.')+`<div class="actions"><button onclick="exportJSON()">전체 JSON 백업</button><button class="secondary" onclick="exportCSV()">프로젝트 목록 CSV</button><button class="secondary" onclick="downloadReport()">현재 보고서 HTML</button></div><div class="field" style="margin-top:15px"><label>JSON 백업 복원 (전체 데이터 교체)</label><input type="file" accept=".json,application/json" onchange="importJSON(this.files[0]);this.value=''" /></div><p class="muted">주의: 브라우저 데이터 삭제, 시크릿 모드, 다른 기기로 이동하면 자동 동기화되지 않습니다. 백업 파일은 민감정보 보관 정책에 따라 관리하세요.</p><p>프로젝트 수: ${state.projects.length}개</p>`+close()}
const pages={'대시보드':dashboard,'표준·헌장':standard,'PMBOK 가이드':guide,'거버넌스':governance,'범위':scopePage,'일정':schedule,'재무':finance,'이해관계자':stakeholder,'자원':resource,'리스크':risk,'AI PM':ai,'데이터':data};

const mmDefaults={mmCadence:'매주 1회, 30분',mmChannel:'주간 회의 + 요약 문서',mmReport:'진척, 우려 사항, 필요한 결정, 다음 주 계획',mmNext:'',mmPM:'승인된 범위·예산 안의 작업 배정과 실행 방법 결정',mmSponsor:'목표·예산·주요 범위 변경 승인 및 장애 해소',mmTeam:'위임된 작업 수행과 개선 제안. 직접 지시는 PM에게 공유',mmThreshold:'범위·예산·핵심 일정 변경은 PM 영향 검토 후 스폰서 승인',mmEscalation:'PM과 직접 협의 → 주간 스폰서 회의 → 합의된 상위 의사결정자',mmTrigger:'권한 밖 지시 반복, 결정기한 초과, 중대한 일정·안전 영향',mmEscOwner:'',mmResponseDue:'',mmCause:'',mmEvidence:'',mmResponse:'',mmOwner:'',mmDue:'',mmEducation:'과도한 감독이 의사결정과 실행을 늦추는 사례를 공유하고, 정기 보고와 위임 범위를 합의한다.',mmIteration:'1주',mmReview:'',mmFeedback:'',mmNextAction:'',mmProbability:3,mmImpact:3,mmRiskReviewed:false,mmRiskNote:'',mmResidualProbability:2,mmResidualImpact:2,mmAgreement:'미합의',mmAgreedBy:'',mmAgreedDate:''};
function mmEnsure(q=p()){for(const [k,v] of Object.entries(mmDefaults))if(q[k]===undefined)q[k]=v;for(const k of ['mmIncidents','mmMeetings','mmFeedbackLog'])if(!Array.isArray(q[k]))q[k]=[];}

function mmStats(){mmEnsure();let q=p();return {score:q.mmProbability*q.mmImpact,residual:q.mmResidualProbability*q.mmResidualImpact,open:q.mmIncidents.filter(r=>r.status!=='종결').length,late:q.mmIncidents.filter(r=>r.status!=='종결'&&r.due&&r.due<iso()).length}}
function mmAdd(kind){mmEnsure();const templates={mmIncidents:{date:iso(),actor:'',event:'',impact:'',cause:'미확인',response:'',owner:'',due:'',status:'열림',result:''},mmMeetings:{date:iso(),participants:'',progress:'',concerns:'',decisions:'',owner:'',due:'',escalation:'',status:'예정'},mmFeedbackLog:{date:iso(),goal:'',feedback:'',change:'',owner:'',due:'',result:''}};addRow(kind,templates[kind])}
const mmIncidentCols=[['일자','date','date'],['개입자','actor'],['관찰한 사건','event'],['업무 영향','impact'],['원인 가설','cause'],['대응 계획','response'],['담당자','owner'],['기한','due','date'],['상태','status','select',['열림','협의 중','에스컬레이션','종결']],['합의·결과','result']];
const mmMeetingCols=[['회의일','date','date'],['참석자','participants'],['진척','progress'],['우려 사항','concerns'],['결정·합의','decisions'],['담당자','owner'],['결정 기한','due','date'],['에스컬레이션 내용','escalation'],['상태','status','select',['예정','진행 중','완료']]];
const mmFeedbackCols=[['검토일','date','date'],['반복 목표','goal'],['스폰서·팀 피드백','feedback'],['수용 변경·범위 영향','change'],['담당자','owner'],['다음 확인일','due','date'],['실험 결과','result']];
function sponsorPage(){mmEnsure();let q=p(),s=mmStats();return top('대표·스폰서 협업 및 마이크로매니징 관리','사실과 업무 영향을 기록하고, 직접 대화로 기대치·위임·보고 방식을 합의합니다. 합의한 승인·안전 점검은 과도한 간섭과 구별하세요.')+`<div class="grid"><div class="metric">미종결 사건<strong>${s.open}건</strong></div><div class="metric">기한 경과<strong>${s.late}건</strong></div><div class="metric">현재 위험<strong>${q.mmRiskReviewed?`${s.score}/25 · ${mmLevel(s.score)}`:'미평가'}</strong></div><div class="metric">권한 합의<strong>${esc(q.mmAgreement)}</strong></div></div><p class="tabnote">토마토·달래 작기 시작 전에 보고 주기, 작업 지시 경로, 변경 승인 기준을 정하세요. 아래 기본값은 수정 가능한 제안이며 실제 합의로 간주하지 않습니다.</p>`+close()+
top('1. 의사소통 주기와 채널')+`<div class="grid">${mmField('소통 주기','mmCadence')}${mmField('채널·문서 위치','mmChannel')}${mmField('다음 회의일','mmNext','date')}</div>${mmText('보고 항목과 스폰서 기대치','mmReport')}`+close()+
top('2. 의사결정 권한과 경계')+`<div class="grid">${mmText('스폰서의 결정 범위','mmSponsor')}${mmText('PM의 결정 범위','mmPM')}${mmText('팀원의 자율성과 지시 경로','mmTeam')}</div>${mmText('변경 승인 기준·금액/일정 한도','mmThreshold')}<div class="grid"><div class="field"><label for="mmAgreement">합의 상태</label><select id="mmAgreement" onchange="update('mmAgreement',this.value)">${['미합의','협의 중','합의 완료','재검토 필요'].map(x=>`<option ${q.mmAgreement===x?'selected':''}>${x}</option>`).join('')}</select></div>${mmField('합의 참여자','mmAgreedBy')}${mmField('합의일','mmAgreedDate','date')}</div><p class="muted">로컬 합의 메모이며 사용자 인증이나 전자서명이 아닙니다.</p>`+close()+
top('3. 간섭 사건과 대응 이력','사람에 대한 평가보다 관찰한 지시, 기존 합의와의 차이, 재작업·지연 등 구체적인 영향을 기록하세요.')+rows('mmIncidents',mmIncidentCols)+`<button onclick="mmAdd('mmIncidents')">+ 간섭 사건</button>`+close()+
top('4. 근본 원인·대응계획·스폰서 교육')+`<div class="grid">${mmText('원인 가설: 정보 부족·과거 실패·신뢰 부족 등','mmCause')}${mmText('스폰서와 확인한 근거·우려','mmEvidence')}${mmText('대응계획·성공 기준','mmResponse')}${mmText('위임과 과도한 감독의 영향 설명','mmEducation')}</div><div class="grid">${mmField('대응 담당자','mmOwner')}${mmField('대응 기한','mmDue','date')}</div>`+close()+
top('5. 주간 회의와 에스컬레이션')+`<div class="grid">${mmText('에스컬레이션 조건','mmTrigger')}${mmText('협의·보고 단계','mmEscalation')}${mmField('최종 조정·결정 담당자','mmEscOwner')}${mmField('응답 시한 합의','mmResponseDue')}</div><h3>주간 회의 기록</h3>`+rows('mmMeetings',mmMeetingCols)+`<button onclick="mmAdd('mmMeetings')">+ 주간 회의</button><p class="muted">에스컬레이션은 기록만 하며 이메일·알림을 자동 발송하지 않습니다.</p>`+close()+
top('6. 애자일·반복적 피드백','짧은 주기로 결과를 보여 주고 피드백을 받습니다. 수용할 변경은 범위·일정 영향을 검토하고 승인 경계에 따라 처리합니다.')+`<div class="grid">${mmField('반복 주기','mmIteration')}${mmField('다음 리뷰일','mmReview','date')}</div>${mmText('현재 피드백','mmFeedback')}${mmText('다음 반복의 개선 행동','mmNextAction')}`+rows('mmFeedbackLog',mmFeedbackCols)+`<button onclick="mmAdd('mmFeedbackLog')">+ 반복 리뷰</button>`+close()+
top('7. 마이크로매니징 위험 평가','발생가능성: 1 매우 낮음 ~ 5 매우 높음. 영향도: 1 경미 ~ 5 중대. 점수=가능성×영향도; 1~5 낮음, 6~11 보통, 12~25 높음. 자체 관리 기준입니다.')+`<div class="grid">${mmScoreInput('발생가능성','mmProbability')}${mmScoreInput('영향도','mmImpact')}${mmScoreInput('대응 후 예상 가능성','mmResidualProbability')}${mmScoreInput('대응 후 예상 영향도','mmResidualImpact')}</div>${mmText('평가 근거·일정/팀 영향·재평가 조건','mmRiskNote')}<label class="item"><span><input type="checkbox" style="width:auto" ${q.mmRiskReviewed?'checked':''} onchange="update('mmRiskReviewed',this.checked)"> 위험 평가 검토 완료</span></label><p>현재 ${s.score}점 (${mmLevel(s.score)}) → 대응 후 예상 ${s.residual}점 (${mmLevel(s.residual)}). 예상 점수는 실측 개선 결과가 아닙니다.</p><button onclick="mmReport()">스폰서 협업 보고서 저장</button>`+close()}
pages['스폰서 협업']=sponsorPage;
const oldAdvice=advice;advice=function(){let a=oldAdvice();mmEnsure();let q=p(),s=mmStats(),add=(title,detail,priority='보통')=>a.push({priority,title,detail});if(q.mmAgreement!=='합의 완료')add('스폰서 권한 경계 미합의','보고 주기와 PM·팀원 위임 범위를 협의하세요.');if(!q.mmRiskReviewed)add('마이크로매니징 위험 미평가','스폰서 협업 탭에서 평가 근거와 점수를 검토하세요.');else if(s.score>=12)add('마이크로매니징 고위험',q.mmResponse||'원인 확인과 대응계획을 작성하세요.','높음');if(s.late)add('간섭 사건 대응기한 경과',s.late+'건의 담당자·기한·에스컬레이션 필요성을 검토하세요.','높음');if(q.mmNext&&q.mmNext<iso())add('스폰서 회의일 경과','회의 결과와 다음 회의일을 갱신하세요.');return a.length>1?a.filter(x=>x.title!=='중요 경고 없음'):a};
const oldDashboard=dashboard;pages['대시보드']=()=>oldDashboard()+top('스폰서 협업')+`<p>미종결 사건 ${mmStats().open}건 · 기한 경과 ${mmStats().late}건 · 위험 ${p().mmRiskReviewed?mmLevel(mmStats().score):'미평가'}</p><button onclick="changeView('스폰서 협업')">협업 계획 검토</button>`+close();
function mmReport(){mmEnsure();let q=p(),s=mmStats();let parts=Object.keys(mmDefaults).map(k=>`<dt>${esc(mmLabels[k]||k)}</dt><dd>${esc(q[k])}</dd>`).join('');let tables=[['간섭 사건',q.mmIncidents,mmIncidentCols],['주간 회의',q.mmMeetings,mmMeetingCols],['반복 리뷰',q.mmFeedbackLog,mmFeedbackCols]].map(([title,data,cols])=>`<h2>${title}</h2><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${data.map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c[1]])}</td>`).join('')}</tr>`).join('')}</table>`).join('');download('Sponsor_report_'+iso()+'.html',new Blob([`<!doctype html><html lang="ko"><meta charset="utf-8"><title>스폰서 협업 보고서</title><style>body{font:15px system-ui;margin:30px;line-height:1.6}dt{font-weight:bold}dd{white-space:pre-wrap}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px}</style><h1>${esc(q.name)} · 스폰서 협업</h1><p>${iso()} · PM ${esc(q.pm)} · 스폰서 ${esc(q.sponsor)}</p><p>위험 평가: ${q.mmRiskReviewed?s.score+'/25':'미평가'}</p><dl>${parts}</dl>${tables}</html>`],{type:'text/html;charset=utf-8'}))}
const mmLabels=Object.fromEntries(Object.keys(mmDefaults).map(k=>[k,k]));
Object.assign(mmLabels,{mmCadence:'소통 주기',mmChannel:'채널',mmReport:'보고 항목',mmNext:'다음 회의',mmPM:'PM 권한',mmSponsor:'스폰서 권한',mmTeam:'팀원 권한',mmThreshold:'변경 승인 기준',mmEscalation:'에스컬레이션 단계',mmTrigger:'에스컬레이션 조건',mmEscOwner:'결정 담당자',mmResponseDue:'응답 시한',mmCause:'원인 가설',mmEvidence:'확인 근거',mmResponse:'대응계획',mmOwner:'담당자',mmDue:'기한',mmEducation:'스폰서 교육',mmIteration:'반복 주기',mmReview:'다음 리뷰',mmFeedback:'피드백',mmNextAction:'개선 행동',mmProbability:'발생가능성',mmImpact:'영향도',mmRiskReviewed:'평가 검토 완료',mmRiskNote:'평가 근거',mmResidualProbability:'대응 후 예상 가능성',mmResidualImpact:'대응 후 예상 영향도',mmAgreement:'합의 상태',mmAgreedBy:'합의 참여자',mmAgreedDate:'합의일'});
const baseDuplicate=duplicate;duplicate=function(){baseDuplicate();p().mmAgreement='미합의';p().mmAgreedBy='';p().mmAgreedDate='';p().mmRiskReviewed=false;p().mmIncidents=[];p().mmMeetings=[];p().mmFeedbackLog=[];save();render()};

render();
</script></body></html>
